<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>

    <!-- Deep black background -->
    <radialGradient id="bg" cx="80%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Halo glow at top-right — white/silver -->
    <radialGradient id="halo" cx="100%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#cccccc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0"/>
    </radialGradient>

    <!-- Bright core -->
    <radialGradient id="core" cx="100%" cy="0%" r="22%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#eeeeee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Background -->
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Halo -->
    <rect width="32" height="32" fill="url(#halo)"/>

    <!-- Rays from top-right corner — white tones -->
    <polygon points="32,0 32,14 -4,32"  fill="#ffffff" opacity="0.08" filter="url(#blur2)"/>
    <polygon points="32,0 28,0 -2,24"   fill="#ffffff" opacity="0.13" filter="url(#blur2)"/>
    <polygon points="32,0 32,6  4,32"   fill="#ffffff" opacity="0.22" filter="url(#blur)"/>
    <polygon points="32,0 32,2 14,32"   fill="#ffffff" opacity="0.18" filter="url(#blur)"/>
    <polygon points="32,0 30,0  8,32"   fill="#dddddd" opacity="0.16" filter="url(#blur)"/>
    <polygon points="32,0 26,0  0,18"   fill="#ffffff" opacity="0.07" filter="url(#blur2)"/>
    <polygon points="32,0 32,10 0,32"   fill="#eeeeee" opacity="0.10" filter="url(#blur2)"/>

    <!-- Bright core at origin -->
    <rect width="32" height="32" fill="url(#core)"/>
  </g>

  <!-- Circle border (subtle white) -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
</svg>
