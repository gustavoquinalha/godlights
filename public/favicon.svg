<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Circular clip -->
    <clipPath id="circle">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>

    <!-- Background gradient: deep navy-purple -->
    <radialGradient id="bg" cx="30%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#6b2fa0"/>
      <stop offset="40%" stop-color="#2d1a6b"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </radialGradient>

    <!-- Halo glow at top-right origin -->
    <radialGradient id="halo" cx="100%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- Ray blur filter -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Background -->
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Halo glow -->
    <rect width="32" height="32" fill="url(#halo)" opacity="0.9"/>

    <!-- Rays from top-right corner -->
    <!-- Ray 1 - widest/softest -->
    <polygon points="32,0 32,14 -4,32" fill="#d946ef" opacity="0.12" filter="url(#blur2)"/>
    <!-- Ray 2 -->
    <polygon points="32,0 28,0 -2,24" fill="#e879f9" opacity="0.18" filter="url(#blur2)"/>
    <!-- Ray 3 - main bright ray -->
    <polygon points="32,0 32,6 4,32" fill="#f0abfc" opacity="0.28" filter="url(#blur)"/>
    <!-- Ray 4 -->
    <polygon points="32,0 32,2 14,32" fill="#e879f9" opacity="0.22" filter="url(#blur)"/>
    <!-- Ray 5 - narrow crisp -->
    <polygon points="32,0 30,0 8,32" fill="#f5d0fe" opacity="0.20" filter="url(#blur)"/>
    <!-- Ray 6 - leftmost faint -->
    <polygon points="32,0 26,0 0,18" fill="#c026d3" opacity="0.10" filter="url(#blur2)"/>
    <!-- Ray 7 -->
    <polygon points="32,0 32,10 0,32" fill="#d8b4fe" opacity="0.14" filter="url(#blur2)"/>

    <!-- Bright core at origin -->
    <radialGradient id="core" cx="100%" cy="0%" r="25%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f0abfc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <rect width="32" height="32" fill="url(#core)"/>
  </g>

  <!-- Circle border (subtle) -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
</svg>
